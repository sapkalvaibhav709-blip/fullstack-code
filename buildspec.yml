version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1
    ACCOUNT_ID: "495456621615"
    IMAGE_REPO_NAME: sample/backend
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws sts get-caller-identity
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 495456621615.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Build started on `date`
      - docker build -t sample/backend .
      - docker tag sample/backend:latest 495456621615.dkr.ecr.ap-south-1.amazonaws.com/sample/backend:latest

  post_build:
    commands:
      - echo Pushing image...
      - docker push 495456621615.dkr.ecr.ap-south-1.amazonaws.com/sample/backend:latest
      - printf '[{"name":"backend","495456621615.dkr.ecr.ap-south-1.amazonaws.com/sample/backend:latest":"%s"}]' "495456621615.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/sample/backend:latest" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
<!DOCTYPE html>
<html>
<head>
    <title>AWS CI/CD Demo</title>

    <style>

body{
font-family:Arial;
margin:40px;
background:#f4f4f4;
}

.card{
background:orange;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px #ddd;
}

button{
padding:10px;
margin-top:15px;
cursor:pointer;
}

pre{
background:#222;
color:#0f0;
padding:10px;
}

    </style>

</head>

<body>

<div class="card">

<h2>Welcome to the AWS CI/CD Demo</h2>

<button onclick="loadUsers()">Get Users</button>

<pre id="result"></pre>

</div>

<script>

async function loadUsers(){

const response = await fetch("/api/users");

const data = await response.json();

document.getElementById("result").innerHTML =
JSON.stringify(data,null,4);

}

</script>

</body>
</html>
